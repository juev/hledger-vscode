name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  ci:
    name: Build, Lint, Test, Package (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install dependencies
      run: |
        npm cache clean --force
        npm ci
    
    # Not `npm run compile`: that emits a debug build into out/, which then gets
    # packaged alongside the esbuild bundle. Here we only need the type check.
    - name: Type-check sources
      run: npm run typecheck

    - name: Run lint
      run: npm run lint

    # esbuild strips types without checking them, so tests need their own pass
    - name: Type-check tests
      run: npm run typecheck:test

    # Runs the same suite as `npm test` and additionally enforces the coverage
    # thresholds. Costs about a second; a threshold nothing executes is no guard.
    - name: Run tests with coverage
      run: npm run test:coverage
      if: success()
    
    - name: Package extension
      run: npx vsce package
    
    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v7
      with:
        name: extension-${{ matrix.node-version }}
        path: "*.vsix"
        retention-days: 7
