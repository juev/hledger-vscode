name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Not `npm run compile`: that emits a debug build into out/, which then
      # gets packaged alongside the esbuild bundle. Only the type check is needed.
      - name: Type-check sources
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Validate semantic version format (x.y.z)
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version '$VERSION' is not in semantic version format (x.y.z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Update package.json version
        run: |
          npm version ${{ steps.extract_version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Update CHANGELOG.md
        run: |
          chmod +x .github/scripts/update-changelog.js
          node .github/scripts/update-changelog.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Package extension
        run: npx vsce package

      - name: Generate release notes
        run: node .github/scripts/generate-release-notes.js > release-notes.md
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload release files
        id: upload
        uses: actions/upload-artifact@v7
        with:
          # Full reruns create a new artifact; partial reruns reuse the build's ID.
          name: release-${{ github.run_attempt }}
          path: |
            *.vsix
            CHANGELOG.md
            release-notes.md
          if-no-files-found: error
          retention-days: 30

  marketplace:
    name: Publish to Microsoft Marketplace
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true

      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Native duplicate handling also covers an upload that succeeded before a timeout.
      - name: Publish to Visual Studio Marketplace
        run: |
          for attempt in 1 2 3; do
            out=$(npx vsce publish --packagePath ./release/*.vsix --azure-credential --skip-duplicate 2>&1) && rc=0 || rc=$?
            echo "$out"
            if [ "$rc" -eq 0 ]; then
              echo "Published to Marketplace on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "vsce publish attempt $attempt failed (exit $rc); retrying in 30s..."
              sleep 30
            fi
          done
          echo "vsce publish failed after 3 attempts"
          exit 1

  open-vsx:
    name: Publish to Open VSX
    needs: build
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: |
          for attempt in 1 2 3; do
            out=$(npx ovsx publish ./release/*.vsix --skip-duplicate 2>&1) && rc=0 || rc=$?
            echo "$out"
            if [ "$rc" -eq 0 ]; then
              echo "Published to Open VSX on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "ovsx publish attempt $attempt failed (exit $rc); retrying in 30s..."
              sleep 30
            fi
          done
          echo "ovsx publish failed after 3 attempts"
          exit 1

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release files
        id: download
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          body_path: release/release-notes.md
          files: "release/*.vsix"
          overwrite_files: false
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Best-effort changelog sync from the tag checkout onto current main.
      - name: Commit CHANGELOG.md
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        continue-on-error: true
        run: |
          cp release/CHANGELOG.md CHANGELOG.md
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changes to CHANGELOG.md"
          else
            git commit -m "chore: update CHANGELOG.md for v${{ needs.build.outputs.version }}"
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              echo "Rebase onto origin/main failed; skipping CHANGELOG push"
              git rebase --abort || true
              exit 0
            fi
            git push origin HEAD:main || echo "Failed to push CHANGELOG.md (non-fatal)"
          fi
